name: PR Validation

on:
  pull_request:
    branches: [ 'react' ]

jobs:
  build-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run build
        run: npm run build
      
      - name: Build validation passed
        run: echo "✅ Build validation passed - PR is valid for merge" 